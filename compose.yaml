name: implicity-6deadshot9-local

x-web-build: &web-build
  context: .
  dockerfile_inline: |
    FROM node:26.13.1-alpine
    WORKDIR /workspace
    COPY package.json pnpm-lock.yaml pnpm-workspace.yaml ./
    COPY web/package.json web/package.json
    COPY engine/react/package.json engine/react/package.json
    COPY engine/demo/package.json engine/demo/package.json
    RUN npx --yes pnpm@12.23.0 install --frozen-lockfile
    CMD ["sleep", "infinity"]

x-api-build: &api-build
  context: .
  dockerfile_inline: |
    FROM python:3.14.7-slim
    COPY --from=ghcr.io/astral-sh/uv:0.11.25 /uv /uvx /bin/
    WORKDIR /workspace
    COPY pyproject.toml uv.lock ./
    COPY api/pyproject.toml api/pyproject.toml
    COPY engine/python/pyproject.toml engine/python/pyproject.toml
    RUN uv sync --all-packages --locked
    CMD ["sleep", "infinity"]

x-app-healthcheck: &app-healthcheck
  interval: 5s
  timeout: 3s
  retries: 3

services:
  web-development:
    profiles: [development]
    build: *web-build
    networks: [app]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]

  web-production:
    profiles: [production]
    build: *web-build
    networks: [app]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]

  api-development:
    profiles: [development]
    build: *api-build
    networks: [app]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]

  api-production:
    profiles: [production]
    build: *api-build
    networks: [app]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]

  hermes:
    profiles: [development, production]
    image: nousresearch/hermes-agent:v0.23.4
    command: [gateway, run]
    networks: [app]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${HERMES_API_KEY:?Set HERMES_API_KEY in .env}
    ports:
      - "127.0.0.1:${HERMES_PORT:-18642}:8642"
    volumes:
      - hermes-data:/opt/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Authorization: Bearer '$$API_SERVER_KEY http://127.0.0.1:8642/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  posthog-db:
    profiles: [development, production]
    image: postgres:15.12-alpine
    networks: [posthog-internal]
    environment:
      POSTGRES_USER: posthog
      POSTGRES_DB: posthog
      POSTGRES_PASSWORD: ${POSTHOG_DB_PASSWORD:?Set POSTHOG_DB_PASSWORD in .env}
    volumes:
      - posthog-db:/var/lib/postgresql/data
      - ./deploy/postgres/create-persons-db.sh:/docker-entrypoint-initdb.d/create-persons-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posthog -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  posthog-redis:
    profiles: [development, production]
    image: redis:7.2.10-alpine
    networks: [posthog-internal]
    command: [redis-server, --maxmemory-policy, allkeys-lru, --maxmemory, 200mb]
    volumes:
      - posthog-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  posthog-zookeeper:
    profiles: [development, production]
    image: zookeeper:3.9.3
    networks:
      posthog-internal:
        aliases: [zookeeper]
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: ruok
    volumes:
      - posthog-zookeeper:/data
      - posthog-zookeeper-datalog:/datalog
    hostname: zookeeper
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 127.0.0.1 2181 | grep imok"]
      interval: 5s
      timeout: 3s
      retries: 12

  posthog-clickhouse:
    profiles: [development, production]
    image: ghcr.io/posthog/clickhouse-posthog:26.9.5.2-posthog-aca5bdabb92f
    networks:
      posthog-internal:
        aliases: [clickhouse]
    depends_on:
      posthog-zookeeper:
        condition: service_healthy
      posthog-kafka:
        condition: service_healthy
      posthog-kafka-topics:
        condition: service_healthy
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_PASSWORD: ${POSTHOG_CH_PASSWORD:?Set POSTHOG_CH_PASSWORD in .env}
      KAFKA_HOSTS: posthog-kafka:9092
    volumes:
      - posthog-clickhouse:/var/lib/clickhouse
      - ./deploy/posthog/config.xml:/etc/clickhouse-server/config.xml:ro
      - ./deploy/posthog/config.d/default.xml:/etc/clickhouse-server/config.d/default.xml:ro
      - ./deploy/posthog/config.d/hobby.xml:/etc/clickhouse-server/config.d/hobby.xml:ro
      - ./deploy/posthog/users.xml:/etc/clickhouse-server/users.xml:ro
      - ./deploy/posthog/user_defined_function.xml:/etc/clickhouse-server/user_defined_function.xml:ro
      - ./deploy/posthog/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
      - ./deploy/posthog/idl:/idl:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user default --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  posthog-kafka:
    profiles: [development, production]
    image: redpandadata/redpanda:v25.1.9
    networks:
      posthog-internal:
        aliases: [kafka]
    command: [redpanda, start, --mode, dev-container, --smp, "1", --memory, 1G, --reserve-memory, 0M, --overprovisioned, --kafka-addr, 0.0.0.0:9092, --advertise-kafka-addr, posthog-kafka:9092, --set, redpanda.auto_create_topics_enabled=true]
    volumes:
      - posthog-kafka:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 12

  posthog-kafka-topics:
    profiles: [development, production]
    image: redpandadata/redpanda:v25.1.9
    networks: [posthog-internal]
    depends_on:
      posthog-kafka:
        condition: service_healthy
    entrypoint: [/bin/sh, /create-topics.sh]
    volumes:
      - ./deploy/posthog/topics.txt:/topics.txt:ro
      - ./deploy/posthog/create-topics.sh:/create-topics.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "rpk topic list --brokers posthog-kafka:9092 | awk '{print $$1}' | grep -qx log_entries"]
      interval: 10s
      timeout: 5s
      retries: 12

  posthog:
    profiles: [development, production]
    image: posthog/posthog@sha256:e83432bf0072817cf30f90bc1d05c3974a9694bc3fa2e2a27b1505be9f1ed519
    networks: [app, posthog-internal]
    command: [bash, -c, "./bin/migrate && ./bin/docker-server"]
    depends_on:
      posthog-db:
        condition: service_healthy
      posthog-redis:
        condition: service_healthy
      posthog-clickhouse:
        condition: service_healthy
      posthog-kafka:
        condition: service_healthy
      posthog-kafka-topics:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://posthog:${POSTHOG_DB_PASSWORD}@posthog-db:5432/posthog
      SECRET_KEY: ${POSTHOG_SECRET:?Set POSTHOG_SECRET in .env}
      REDIS_URL: redis://posthog-redis:6379/
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${POSTHOG_CH_PASSWORD:?Set POSTHOG_CH_PASSWORD in .env}
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      KAFKA_HOSTS: posthog-kafka:9092
      PERSONS_DATABASE_URL: postgres://posthog:${POSTHOG_DB_PASSWORD}@posthog-db:5432/posthog
      BEHAVIORAL_COHORTS_DATABASE_URL: postgres://posthog:${POSTHOG_DB_PASSWORD}@posthog-db:5432/posthog
      PERSONS_DB_WRITER_URL: postgres://posthog:${POSTHOG_DB_PASSWORD}@posthog-db:5432/posthog_persons
      PERSONS_DB_READER_URL: postgres://posthog:${POSTHOG_DB_PASSWORD}@posthog-db:5432/posthog_persons
      SITE_URL: http://localhost:${POSTHOG_PORT:-18000}
      DEPLOYMENT: hobby
      GRANIAN_WORKERS: 2
      POSTHOG_GRANIAN_PRELOAD: "true"
      OPT_OUT_CAPTURE: "true"
      SECURE_COOKIES: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/_health/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20m
    volumes:
      - posthog-data:/var/lib/posthog

  posthog-worker:
    profiles: [development, production]
    image: posthog/posthog@sha256:e83432bf0072817cf30f90bc1d05c3974a9694bc3fa2e2a27b1505be9f1ed519
    networks: [posthog-internal]
    restart: unless-stopped
    command: [./bin/docker-worker-celery, --with-embedded-scheduler]
    depends_on:
      posthog:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://posthog:${POSTHOG_DB_PASSWORD}@posthog-db:5432/posthog
      SECRET_KEY: ${POSTHOG_SECRET:?Set POSTHOG_SECRET in .env}
      REDIS_URL: redis://posthog-redis:6379/
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${POSTHOG_CH_PASSWORD:?Set POSTHOG_CH_PASSWORD in .env}
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      KAFKA_HOSTS: posthog-kafka:9092
      PERSONS_DATABASE_URL: postgres://posthog:${POSTHOG_DB_PASSWORD}@posthog-db:5432/posthog
      BEHAVIORAL_COHORTS_DATABASE_URL: postgres://posthog:${POSTHOG_DB_PASSWORD}@posthog-db:5432/posthog
      PERSONS_DB_WRITER_URL: postgres://posthog:${POSTHOG_DB_PASSWORD}@posthog-db:5432/posthog_persons
      PERSONS_DB_READER_URL: postgres://posthog:${POSTHOG_DB_PASSWORD}@posthog-db:5432/posthog_persons
      DEPLOYMENT: hobby
      WEB_CONCURRENCY: 2
      CELERY_MAX_TASKS_PER_CHILD: 1000
      OPT_OUT_CAPTURE: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "from posthog.celery import app; app.connection_for_read().ensure_connection(max_retries=0)"]
      interval: 10s
      timeout: 5s
      retries: 12

  posthog-capture:
    profiles: [development, production]
    image: ghcr.io/posthog/posthog/capture:master@sha256:3ee923633b5d8936bb8119ddb3c07f00628c02b3e7cb1316c17c847b5b9655ca
    networks: [posthog-internal]
    environment:
      ADDRESS: 0.0.0.0:3000
      KAFKA_TOPIC: events_plugin_ingestion
      CAPTURE_OUTPUT_ANALYTICS_MAIN_TOPIC: events_plugin_ingestion
      KAFKA_ERROR_TRACKING_TOPIC: ingestion-errortracking-main
      CAPTURE_OUTPUT_ERROR_TRACKING_TOPIC: ingestion-errortracking-main
      KAFKA_HOSTS: posthog-kafka:9092
      KAFKA_INGESTION_PRODUCER_METADATA_BROKER_LIST: posthog-kafka:9092
      REDIS_URL: redis://posthog-redis:6379/
      CAPTURE_MODE: events
      RUST_LOG: info,rdkafka=warn
    depends_on:
      posthog-kafka:
        condition: service_healthy
      posthog-kafka-topics:
        condition: service_healthy
      posthog-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/_readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  posthog-ingestion-general:
    profiles: [development, production]
    image: ghcr.io/posthog/posthog-node@sha256:fb496e55708308c9e4cd324e301d0f665c8a4b2403131481c55f2f31b897afc6
    command: [node, nodejs/dist/index.js]
    networks: [posthog-internal]
    restart: on-failure
    depends_on:
      posthog:
        condition: service_healthy
      posthog-db:
        condition: service_healthy
      posthog-redis:
        condition: service_healthy
      posthog-clickhouse:
        condition: service_healthy
      posthog-kafka:
        condition: service_healthy
      posthog-kafka-topics:
        condition: service_healthy
    environment:
      PLUGIN_SERVER_MODE: ingestion-v2
      DATABASE_URL: postgres://posthog:${POSTHOG_DB_PASSWORD}@posthog-db:5432/posthog
      PERSONS_DATABASE_URL: postgres://posthog:${POSTHOG_DB_PASSWORD}@posthog-db:5432/posthog
      BEHAVIORAL_COHORTS_DATABASE_URL: postgres://posthog:${POSTHOG_DB_PASSWORD}@posthog-db:5432/posthog
      KAFKA_HOSTS: posthog-kafka:9092
      REDIS_URL: redis://posthog-redis:6379/
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${POSTHOG_CH_PASSWORD:?Set POSTHOG_CH_PASSWORD in .env}
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      COOKIELESS_REDIS_HOST: posthog-redis
      COOKIELESS_REDIS_PORT: 6379
      CDP_REDIS_HOST: posthog-redis
      ENCRYPTION_SALT_KEYS: ${POSTHOG_ENCRYPTION_SALT_KEYS:?Set POSTHOG_ENCRYPTION_SALT_KEYS in .env}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6738/_ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  posthog-proxy:
    profiles: [development, production]
    image: caddy:2.10.2-alpine
    networks: [posthog-internal]
    ports:
      - "127.0.0.1:${POSTHOG_PORT:-18000}:8000"
    volumes:
      - ./deploy/posthog/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      posthog:
        condition: service_healthy
      posthog-capture:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/_health/"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  hermes-data:
  posthog-db:
  posthog-redis:
  posthog-clickhouse:
  posthog-kafka:
  posthog-zookeeper:
  posthog-zookeeper-datalog:
  posthog-data:

networks:
  app:
  posthog-internal:

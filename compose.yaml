name: implicity-local

x-web-build: &web-build
  context: .
  dockerfile_inline: |
    FROM node:26.13.1-alpine
    WORKDIR /workspace
    COPY package.json pnpm-lock.yaml pnpm-workspace.yaml ./
    COPY web/package.json web/package.json
    COPY engine/react/package.json engine/react/package.json
    COPY engine/demo/package.json engine/demo/package.json
    RUN npx --yes pnpm@12.23.0 install --frozen-lockfile
    CMD ["sleep", "infinity"]

x-api-build: &api-build
  context: .
  dockerfile_inline: |
    FROM python:3.14.7-slim
    COPY --from=ghcr.io/astral-sh/uv:0.11.25 /uv /uvx /bin/
    WORKDIR /workspace
    COPY pyproject.toml uv.lock ./
    COPY api/pyproject.toml api/pyproject.toml
    COPY engine/python/pyproject.toml engine/python/pyproject.toml
    RUN uv sync --all-packages --locked
    CMD ["sleep", "infinity"]

x-app-healthcheck: &app-healthcheck
  interval: 5s
  timeout: 3s
  retries: 3

services:
  web-development:
    profiles: [development]
    build: *web-build
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]

  web-production:
    profiles: [production]
    build: *web-build
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]

  api-development:
    profiles: [development]
    build: *api-build
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]

  api-production:
    profiles: [production]
    build: *api-build
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]

  hermes:
    profiles: [development, production]
    image: nousresearch/hermes-agent:v0.23.4
    command: [gateway, run]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${HERMES_API_KEY:?Set HERMES_API_KEY in .env}
    ports:
      - "127.0.0.1:${HERMES_PORT:-18642}:8642"
    volumes:
      - hermes-data:/opt/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Authorization: Bearer '$$API_SERVER_KEY http://127.0.0.1:8642/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  posthog-db:
    profiles: [development, production]
    image: postgres:15.12-alpine
    environment:
      POSTGRES_USER: posthog
      POSTGRES_DB: posthog
      POSTGRES_PASSWORD: ${POSTHOG_DB_PASSWORD:?Set POSTHOG_DB_PASSWORD in .env}
    volumes:
      - posthog-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posthog -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  posthog-redis:
    profiles: [development, production]
    image: redis:7.2.10-alpine
    command: [redis-server, --maxmemory-policy, allkeys-lru, --maxmemory, 200mb]
    volumes:
      - posthog-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  posthog-clickhouse:
    profiles: [development, production]
    image: ghcr.io/posthog/clickhouse-posthog:26.9.5.2-posthog-aca5bdabb92f
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      KAFKA_HOSTS: posthog-kafka:9092
    volumes:
      - posthog-clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  posthog-kafka:
    profiles: [development, production]
    image: redpandadata/redpanda:v25.1.9
    command: [redpanda, start, --mode, dev-container, --smp, "1", --memory, 1G, --reserve-memory, 0M, --overprovisioned, --kafka-addr, 0.0.0.0:9092, --advertise-kafka-addr, posthog-kafka:9092]
    volumes:
      - posthog-kafka:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 12

  posthog:
    profiles: [development, production]
    image: posthog/posthog:be0a6f2a4cb4f9614a7954e01032ca3223bfdbaf
    command: [bash, -c, "./bin/migrate && ./bin/docker-server"]
    depends_on:
      posthog-db:
        condition: service_healthy
      posthog-redis:
        condition: service_healthy
      posthog-clickhouse:
        condition: service_healthy
      posthog-kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://posthog:${POSTHOG_DB_PASSWORD}@posthog-db:5432/posthog
      SECRET_KEY: ${POSTHOG_SECRET:?Set POSTHOG_SECRET in .env}
      REDIS_URL: redis://posthog-redis:6379/
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      KAFKA_HOSTS: posthog-kafka:9092
      PERSONS_DATABASE_URL: postgres://posthog:${POSTHOG_DB_PASSWORD}@posthog-db:5432/posthog
      BEHAVIORAL_COHORTS_DATABASE_URL: postgres://posthog:${POSTHOG_DB_PASSWORD}@posthog-db:5432/posthog
      SITE_URL: http://localhost:${POSTHOG_PORT:-18000}
      DEPLOYMENT: hobby
      GRANIAN_WORKERS: 2
      POSTHOG_GRANIAN_PRELOAD: "true"
      OPT_OUT_CAPTURE: "true"
    ports:
      - "127.0.0.1:${POSTHOG_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/_health/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15m
    volumes:
      - posthog-data:/var/lib/posthog

  posthog-worker:
    profiles: [development, production]
    image: posthog/posthog:be0a6f2a4cb4f9614a7954e01032ca3223bfdbaf
    command: [./bin/docker-worker-celery, --with-embedded-scheduler]
    depends_on:
      posthog:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://posthog:${POSTHOG_DB_PASSWORD}@posthog-db:5432/posthog
      SECRET_KEY: ${POSTHOG_SECRET:?Set POSTHOG_SECRET in .env}
      REDIS_URL: redis://posthog-redis:6379/
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      KAFKA_HOSTS: posthog-kafka:9092
      PERSONS_DATABASE_URL: postgres://posthog:${POSTHOG_DB_PASSWORD}@posthog-db:5432/posthog
      BEHAVIORAL_COHORTS_DATABASE_URL: postgres://posthog:${POSTHOG_DB_PASSWORD}@posthog-db:5432/posthog
      DEPLOYMENT: hobby
      WEB_CONCURRENCY: 2
      CELERY_MAX_TASKS_PER_CHILD: 1000
      OPT_OUT_CAPTURE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  hermes-data:
  posthog-db:
  posthog-redis:
  posthog-clickhouse:
  posthog-kafka:
  posthog-data:

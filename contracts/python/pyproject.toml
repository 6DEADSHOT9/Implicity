[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "implicity-contracts"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "jsonschema==4.26.0",
    "pydantic==2.14.4",
    "rfc3339-validator==0.1.4",
]

[tool.setuptools.package-data]
implicity_contracts = ["schema.json"]

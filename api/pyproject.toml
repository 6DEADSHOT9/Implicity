[project]
name = "implicity-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.17.2",
    "fastapi==0.121.3",
    "httpx==0.28.1",
    "implicity-contracts",
    "mcp==2.3.0",
    "sqlalchemy==2.0.44",
    "uvicorn==0.38.0",
]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
implicity-backup = "implicity_api.backup:main"

[tool.uv.sources]
implicity-contracts = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

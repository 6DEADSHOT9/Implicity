[project]
name = "implicity-engine"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["implicity-contracts"]

[tool.uv.sources]
implicity-contracts = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

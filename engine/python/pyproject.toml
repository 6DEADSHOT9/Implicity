[project]
name = "implicity-engine"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["implicity-contracts", "pyyaml==6.0.4"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.uv.sources]
implicity-contracts = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
